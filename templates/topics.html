<section><h2>Topic Library</h2><p>Manage separate content folders. Titles are consumed only when scheduling succeeds.</p><label>Topic folder</label><select id="libTopic"></select> <button id="libNew" type="button">+ Add Topic</button><p id="libCounts"></p><label>Topic name</label><input id="libName" maxlength="60"><label>Default hashtags</label><textarea id="libTags" maxlength="400"></textarea><label>Default keywords</label><textarea id="libKeys" maxlength="1000"></textarea><button id="libSave" type="button">Save topic</button></section><section><h2>Bulk import</h2><select id="libFormat"><option value="txt">TXT — one title per line</option><option value="csv">CSV — title,description,hashtags,keywords</option><option value="json">JSON — array of objects</option></select><input id="libFile" type="file" accept=".txt,.csv,.json"><textarea id="libContent" rows="10" style="width:100%" placeholder="Paste titles or structured metadata here"></textarea><button id="libImport" type="button">Import content</button><p id="libMessage" role="status"></p></section><section><h2>Saved titles</h2><div id="libRows"></div><button id="libPrev" type="button">Previous</button> <button id="libNext" type="button">Next</button></section>
<script>(()=>{const $=x=>document.getElementById(x),csrf={{session.csrf|tojson}},profile={{active|tojson}};let topics=[],offset=0;const msg=x=>$('libMessage').textContent=x;async function api(path,values){let options={};if(values){let f=new FormData();for(let [k,v] of Object.entries({...values,csrf,profile}))f.append(k,v);options={method:'POST',body:f}}let r=await fetch(path,options);if(!r.ok){let d=await r.json().catch(()=>({}));throw Error(d.error||'Request failed '+r.status)}return r.json()}function safe(fn){return async()=>{try{await fn()}catch(e){msg(e.message)}}}async function refresh(preferred){topics=(await api('/topics?profile='+encodeURIComponent(profile))).topics;for(let id of ['libTopic','smartTopic']){let el=$(id),old=preferred||el.value;el.replaceChildren();for(let t of topics)el.add(new Option(t.name,id==='smartTopic'?t.name:t.id));if([...el.options].some(o=>o.value===old))el.value=old}await select()}async function select(){let t=topics.find(t=>t.id===$('libTopic').value);if(!t)return;$('libName').value=t.name;$('libTags').value=t.hashtags;$('libKeys').value=t.keywords;$('libCounts').textContent=`${t.total} saved · ${t.used} used · ${t.total-t.used} unused`;await rows()}async function rows(){let tid=$('libTopic').value;let data=await api('/topics/titles?profile='+encodeURIComponent(profile)+'&topic_id='+encodeURIComponent(tid)+'&offset='+offset);$('libRows').replaceChildren();for(let r of data.titles){let p=document.createElement('p'),b=document.createElement('button');p.textContent=r.title+' · '+(r.used?'Used':'Unused')+' ';b.textContent='Delete';b.onclick=safe(async()=>{if(confirm('Delete library entry? Title history is retained.')){await api('/topics/delete-title',{topic_id:tid,key:r.key});await refresh(tid)}});p.append(b);$('libRows').append(p)}$('libPrev').disabled=offset===0;$('libNext').disabled=data.titles.length<100} $('libTopic').onchange=safe(async()=>{offset=0;await select()});$('libNew').onclick=()=>{$('libName').value='';$('libTags').value='';$('libKeys').value='';$('libName').focus()};$('libSave').onclick=safe(async()=>{let name=$('libName').value.trim();await api('/topics/save',{name,hashtags:$('libTags').value,keywords:$('libKeys').value});offset=0;await refresh();let t=topics.find(x=>x.name===name);if(t){$('libTopic').value=t.id;await select()}msg('Topic saved')});$('libFile').onchange=safe(async()=>{let f=$('libFile').files[0];if(f){$('libContent').value=await f.text();$('libFormat').value=f.name.split('.').pop().toLowerCase()}});$('libImport').onclick=safe(async()=>{let tid=$('libTopic').value;let d=await api('/topics/import',{topic_id:tid,format:$('libFormat').value,content:$('libContent').value});$('libContent').value='';offset=0;await refresh(tid);msg('Imported '+d.added+' new titles')});$('libPrev').onclick=safe(async()=>{offset=Math.max(0,offset-100);await rows()});$('libNext').onclick=safe(async()=>{offset+=100;await rows()});safe(()=>refresh())()})();</script>
