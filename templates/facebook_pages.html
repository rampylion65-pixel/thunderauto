<!doctype html><html><meta name="viewport" content="width=device-width,initial-scale=1"><title>Select Facebook Page</title><body style="background:#101020;color:white;font:16px system-ui;padding:24px"><h1>Select Facebook Page</h1><form method="post" action="/facebook/select"><input type="hidden" name="csrf" value="{{session.csrf}}"><input type="hidden" name="profile" value="{{active}}">{% for p in pages %}<p><label><input type="radio" name="page_id" value="{{p.id}}" required> {{p.name}}</label></p>{% else %}<p>No authorized Pages returned. Check Page access and permissions.</p>{% endfor %}{% if pages %}<button>Connect selected Page</button>{% endif %}</form><p><a style="color:#c4aaff" href="/?profile={{active}}#accounts">Cancel</a></p></body></html>
