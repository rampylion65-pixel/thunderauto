<section id="smartWizard"><h2>Smart bulk publishing</h2><p id="smartStep">01 Upload · 02 AI Content · 03 Schedule</p><div id="smartFiles"><div class="drop"><label>Choose MP4 videos (100 MB total per batch)</label><input id="smartPicker" type="file" accept="video/mp4" multiple><p id="smartCount">0 videos detected</p></div><div id="smartList"></div><button type="button" id="smartMore">+ Add more</button> <button type="button" id="smartNext">Next →</button></div><div id="smartContent" hidden><label>Topic</label><input id="smartTopic" placeholder="Lord Buddha" maxlength="300"><label>Language</label><select id="smartLang"><option>English</option><option>Hindi</option><option>Nepali</option></select><label>Videos per day per platform</label><select id="smartDaily"><option>1</option><option selected>2</option><option>3</option><option>4</option><option>5</option></select><label>Start date (IST)</label><input type="date" id="smartStart"><p>Morning 6–7 AM · Evening 5–6 PM IST. Starts on the next full available day.</p><button type="button" id="smartBack">Back</button> <button type="button" id="smartGenerate">Generate AI content & schedule</button></div><div id="smartReview" hidden><label><input type="checkbox" id="smartYT" {% if connected %}checked{% else %}disabled{% endif %}> YouTube</label><label><input type="checkbox" id="smartFB" {% if facebook %}checked{% else %}disabled{% endif %}> Facebook</label><label>YouTube audience</label><select id="smartKids"><option value="">Choose audience</option><option value="no">Not made for kids</option><option value="yes">Made for kids</option></select><p id="smartSummary"></p><div id="smartItems"></div><button type="button" id="smartRegen">Back / regenerate</button> <button type="button" id="smartConfirm">Confirm & schedule all</button><progress id="smartProgress" max="100" value="0" style="width:100%"></progress></div><p id="smartMessage" role="status"></p></section>
<script>(()=>{const $=id=>document.getElementById(id), csrf={{session.csrf|tojson}}, profile={{active|tojson}};let files=[],items=[],busy=false;const msg=t=>$('smartMessage').textContent=t;function step(n){['smartFiles','smartContent','smartReview'].forEach((id,i)=>$(id).hidden=i!==n);$('smartStep').textContent=['01 Upload','02 AI Content & schedule','03 Review & confirm'][n];msg('')}function draw(){let size=files.reduce((a,f)=>a+f.size,0);$('smartCount').textContent=`${files.length} videos detected · ${(size/1048576).toFixed(1)} MB`;let list=$('smartList');list.replaceChildren();files.forEach((f,i)=>{let row=document.createElement('p'),b=document.createElement('button');row.textContent=f.name+' ';b.textContent='Remove';b.onclick=()=>{files.splice(i,1);draw()};row.append(b);list.append(row)});$('smartNext').disabled=!files.length||size>95*1048576||files.length>100} $('smartPicker').onchange=e=>{for(let f of e.target.files)if(f.name.toLowerCase().endsWith('.mp4')&&!files.some(x=>x.name===f.name&&x.size===f.size&&x.lastModified===f.lastModified))files.push(f);e.target.value='';draw()};$('smartMore').onclick=()=>$('smartPicker').click();$('smartNext').onclick=()=>step(1);$('smartBack').onclick=()=>step(0);$('smartRegen').onclick=()=>step(1);$('smartStart').value=new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Kolkata',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date());function base(){let f=new FormData();f.append('csrf',csrf);f.append('profile',profile);return f}function summary(){$('smartSummary').textContent=`${files.length} videos · ${files.length*(Number($('smartYT').checked)+Number($('smartFB').checked))} publications`};$('smartYT').onchange=$('smartFB').onchange=summary;$('smartGenerate').onclick=async()=>{if(busy)return;busy=true;let b=$('smartGenerate');b.disabled=true;msg('Generating unique metadata…');try{let f=base();for(let [k,v] of Object.entries({names:JSON.stringify(files.map(x=>x.name)),topic:$('smartTopic').value,language:$('smartLang').value,daily:$('smartDaily').value,start:$('smartStart').value}))f.append(k,v);let r=await fetch('/smart/preview',{method:'POST',body:f}),data=await r.json();if(!r.ok)throw Error(data.error);items=data.items;let list=$('smartItems');list.replaceChildren();items.forEach((item,i)=>{let box=document.createElement('div');box.className='account';let p=document.createElement('p');p.textContent=files[i].name+' · '+item.scheduled+' IST';let t=document.createElement('input');t.value=item.title;t.maxLength=99;t.style.width='100%';t.oninput=()=>item.title=t.value;let d=document.createElement('textarea');d.value=item.description;d.maxLength=5000;d.style.cssText='width:100%;min-height:90px;background:#0d1020;color:white;border:1px solid #7771b755;border-radius:12px;padding:12px';d.oninput=()=>item.description=d.value;box.append(p,t,d);list.append(box)});step(2);summary()}catch(e){msg(e.message)}finally{busy=false;b.disabled=false}};$('smartConfirm').onclick=()=>{if(busy)return;let f=base();if(!$('smartYT').checked&&!$('smartFB').checked)return msg('Select a connected platform');if(!$('smartKids').value&&$('smartYT').checked)return msg('Choose YouTube audience');if(items.some(x=>!x.title.trim())||new Set(items.map(x=>x.title.trim().toLowerCase())).size!==items.length)return msg('Titles must be unique and nonempty');if($('smartYT').checked)f.append('platform','YouTube');if($('smartFB').checked)f.append('platform','Facebook');f.append('kids',$('smartKids').value||'no');f.append('items',JSON.stringify(items));files.forEach(x=>f.append('video',x));busy=true;$('smartConfirm').disabled=$('smartRegen').disabled=true;let xhr=new XMLHttpRequest();xhr.open('POST','/smart/upload');xhr.upload.onprogress=e=>{if(e.lengthComputable)$('smartProgress').value=100*e.loaded/e.total;msg('Uploading batch…')};xhr.onload=()=>{if(xhr.status===200){try{location.href=JSON.parse(xhr.responseText).url;return}catch(e){}}msg('Upload failed ('+xhr.status+'). Check queue before retrying.');busy=false;$('smartConfirm').disabled=$('smartRegen').disabled=false};xhr.onerror=()=>{msg('Connection interrupted. Check queue before retrying.');busy=false;$('smartConfirm').disabled=$('smartRegen').disabled=false};xhr.send(f)};draw()})();</script>
